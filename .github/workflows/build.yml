name: Build Adws APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # نصب Java 17 واقعی
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # اجبار استفاده از Java 17 (حل مشکل Java 11)
      - name: Force Java 17 environment
        run: |
          export JAVA_HOME=$JAVA_HOME
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # دسترسی اجرا به gradlew
      - name: Grant permission for gradlew
        run: chmod +x gradlew

      # پاکسازی پروژه
      - name: Clean project
        run: ./gradlew clean

      # ساخت APK
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      # آپلود فایل APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adws-apk
          path: app/build/outputs/apk/debug/*.apk
