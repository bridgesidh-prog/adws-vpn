name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java
        run: |
          java -version
          echo $JAVA_HOME

      - name: Grant permission
        run: chmod +x gradlew

      - name: Clean Build
        run: ./gradlew clean build --stacktrace --no-daemon